<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframe 测试页</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font: 14px/1.6 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #1f2329;
      }
      h3 {
        margin: 0 0 8px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      header h3 {
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .badge {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 10px;
        border-radius: 10px;
        background: #f0f0f0;
        font-size: 12px;
        font-weight: normal;
      }
      .badge.on {
        background: #d9f7be;
      }
      .badge.off {
        background: #ffd8bf;
      }
      dl {
        margin: 8px 0;
      }
      dt {
        float: left;
        width: 90px;
        clear: left;
        color: #888;
      }
      dd {
        margin: 0 0 2px 100px;
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 8px;
        margin: 10px 0;
      }
      input {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #log {
        max-height: 260px;
        overflow: auto;
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #eee;
        font-family: Consolas, Monaco, monospace;
        font-size: 12px;
      }
      .item {
        padding: 2px 0;
        border-bottom: 1px dashed #f5f5f5;
        word-break: break-all;
      }
      .dir-in {
        color: #1677ff;
      }
      .dir-out {
        color: #52c41a;
      }
    </style>
  </head>
  <body>
    <header>
      <h3>iframe 测试页（模拟 agent 页面）<span id="state" class="badge">抽屉状态：未知</span></h3>
      <div class="actions">
        <button id="session-btn" type="button">会话状态：空闲</button>
        <button id="fs-btn" type="button">全屏</button>
        <button id="close-btn" type="button">关闭</button>
      </div>
    </header>
    <dl id="params"></dl>
    <div class="row">
      <input id="text" value="分析报告.pdf" />
      <button id="send">发消息给宿主（{message, files, ...}）</button>
    </div>
    <div id="log"></div>

    <script>
      (function () {
        var paramsEl = document.getElementById('params');
        var logEl = document.getElementById('log');
        var stateEl = document.getElementById('state');
        var input = document.getElementById('text');

        function log(dir, label, data) {
          var row = document.createElement('div');
          row.className = 'item';
          var head = document.createElement('span');
          head.className = dir === 'in' ? 'dir-in' : 'dir-out';
          head.textContent =
            '[' + new Date().toLocaleTimeString() + '] ' + (dir === 'in' ? '收到 ← ' : '发送 → ');
          row.appendChild(head);
          row.appendChild(
            document.createTextNode(label + (data ? ' ' + JSON.stringify(data) : '')),
          );
          logEl.appendChild(row);
          logEl.scrollTop = logEl.scrollHeight;
        }

        // ---- 就绪消息（drawer-ready）：告知宿主（ckc-expert-agent）iframe 页面初始化完成 ----
        // 宿主以此判定加载成功（不靠 load 事件），收到后才会发显隐 / 排队消息
        // 延迟 3 秒再发，模拟真实场景 iframe 初始化较慢：期间宿主侧应显示加载动画
        setTimeout(function () {
          parent.postMessage({ source: 'ckc-expert-agent', type: 'drawer-ready' }, '*');
          log('out', 'drawer-ready（延迟 3 秒发送，模拟真实初始化耗时）');
        }, 3000);

        // ---- 展示 URL 参数：/center/thd/chat/:agentCode[/:sessionId]?token=xxx ----
        var segs = location.pathname.split('/').filter(Boolean);
        // 宿主未传 sessionId 时，生成一个 sessionId 并发送给宿主（固定协议 drawer-session）
        var sessionId = segs[4];
        if (!sessionId) {
          sessionId = 'sess-' + Date.now();
          parent.postMessage(
            { source: 'ckc-expert-agent', type: 'drawer-session', payload: sessionId },
            '*',
          );
          log('out', 'drawer-session（生成 sessionId 发给宿主）', sessionId);
        }
        var info = {
          agentCode: segs[3] || '(无)',
          sessionId: sessionId,
          token: new URLSearchParams(location.search).get('token') || '(无)',
        };
        Object.keys(info).forEach(function (k) {
          var dt = document.createElement('dt');
          dt.textContent = k + '：';
          var dd = document.createElement('dd');
          dd.textContent = info[k];
          paramsEl.appendChild(dt);
          paramsEl.appendChild(dd);
        });

        // ---- 接收容器（组件 / 宿主页）消息 ----
        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || d.source !== 'ckc-expert-agent') {
            log('in', '其他消息', d);
            return;
          }
          if (d.type === 'drawer-message') {
            log('in', 'drawer-message（宿主 sendMessage）', d.payload);
            // 回执一条消息给宿主页，演示 receiveMessage（{message, files, sessionId?, ...其它附带字段}）
            var reply = {
              message: '已收到消息',
              files: (d.payload && d.payload.files) || [],
              sessionId: sessionId, // 附带会话 ID，验证宿主 receiveMessage 能收到 sessionId
              ts: Date.now(), // 其它附带字段，原样透传
            };
            parent.postMessage({ source: 'ckc-expert-agent', type: 'drawer-message', payload: reply }, '*');
            log('out', '消息（回执给宿主）', reply);
          } else if (d.type === 'drawer-config') {
            log('in', 'drawer-config（组件配置）', d.payload);
          } else if (d.type === 'drawer-width-state') {
            // 拖拽调宽结束时组件同步的宽度状态（atMax / atMin = 当前宽度是否为最大 / 最小值）：
            // 据此控制「全屏 / 取消全屏」按钮状态（宽度为最大值 → 按钮显示「取消全屏」）
            fullscreen = d.atMax === true;
            fsBtn.textContent = fullscreen ? '取消全屏' : '全屏';
            log('in', 'drawer-width-state（宽度状态，同步全屏按钮）', {
              atMax: d.atMax,
              atMin: d.atMin,
            });
          } else if (d.type === 'drawer-visibility-change') {
            log('in', '抽屉显隐', { visible: d.visible, openSource: d.openSource });
            stateEl.textContent = d.visible
              ? '抽屉状态：显示中'
              : '抽屉状态：已隐藏（iframe 继续运行）';
            stateEl.className = 'badge ' + (d.visible ? 'on' : 'off');
          } else {
            log('in', '组件消息', d);
          }
        });

        // ---- 发消息给宿主页（固定协议 drawer-message，payload 为 {message, files, sessionId?, ...其它附带字段}）----
        document.getElementById('send').addEventListener('click', function () {
          var msg = {
            message: '分析完成：' + (input.value || '产物文件.pdf'),
            files: [
              {
                name: input.value || '产物文件.pdf',
                url: 'https://example.com/' + encodeURIComponent(input.value || '产物文件.pdf'),
                type: 'pdf',
              },
            ],
            sessionId: sessionId, // 附带会话 ID，验证宿主 receiveMessage 能收到 sessionId
            ts: Date.now(), // 其它附带字段，原样透传
          };
          parent.postMessage(
            { source: 'ckc-expert-agent', type: 'drawer-message', payload: msg },
            '*',
          );
          log('out', '消息（发给宿主）', msg);
        });

        // ---- 会话状态（固定协议 drawer-session-state）：上报当前 agent 是否处于正在会话状态 ----
        // 初始化完成后上报当前状态，状态变化时再次上报；宿主组件缓存后随 onVisibilityChange 回调带出
        // header 上的按钮用于模拟切换会话中 / 空闲，验证宿主按会话状态决策（如会话中才弹关闭确认框）
        var sessionActive = false;
        var sessionBtn = document.getElementById('session-btn');
        function reportSessionState() {
          parent.postMessage(
            { source: 'ckc-expert-agent', type: 'drawer-session-state', sessionActive: sessionActive },
            '*',
          );
          sessionBtn.textContent = sessionActive ? '会话状态：会话中' : '会话状态：空闲';
          log('out', 'drawer-session-state（上报会话状态）', { sessionActive: sessionActive });
        }
        reportSessionState(); // 初始上报
        sessionBtn.addEventListener('click', function () {
          sessionActive = !sessionActive;
          reportSessionState();
        });

        // ---- header 上的全屏按钮：固定协议 drawer-fullscreen，宿主组件据此调整抽屉宽度 ----
        // 全屏（fullscreen: true）→ 抽屉宽度变为最大值，按钮变为「取消全屏」；
        // 取消全屏（fullscreen: false）→ 抽屉宽度变为最小值
        var fullscreen = false;
        var fsBtn = document.getElementById('fs-btn');
        fsBtn.addEventListener('click', function () {
          fullscreen = !fullscreen;
          parent.postMessage(
            { source: 'ckc-expert-agent', type: 'drawer-fullscreen', fullscreen: fullscreen },
            '*',
          );
          fsBtn.textContent = fullscreen ? '取消全屏' : '全屏';
          log('out', fullscreen ? 'drawer-fullscreen（请求全屏）' : 'drawer-fullscreen（取消全屏）', {
            fullscreen: fullscreen,
          });
        });

        // ---- header 上的关闭按钮：固定协议 drawer-close，与原抽屉关闭按钮功能一致 ----
        // 宿主收到后只隐藏抽屉（移出视口，不销毁），iframe 继续运行
        document.getElementById('close-btn').addEventListener('click', function () {
          parent.postMessage({ source: 'ckc-expert-agent', type: 'drawer-close' }, '*');
          log('out', 'drawer-close（请求关闭抽屉）');
        });
      })();
    </script>
  </body>
</html>
