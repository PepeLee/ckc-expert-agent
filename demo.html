<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ckc-expert-agent CDN 接入演示</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>宿主页面（模拟 CDN 接入方）</h1>
    <p>点击右下角悬浮圆形按钮打开抽屉（拖动按钮可移动位置）。</p>
    <p>抽屉左上角的黄色元素用于验证抽屉浮在页面最上方：</p>
    <p>
      <button onclick="drawer.open()">drawer.open() 打开</button>
      <button onclick="drawer.close()">drawer.close() 关闭</button>
      <button
        onclick="drawer.sendMessage({ message: '你好', files: [{ name: 'report.pdf', url: 'https://example.com/report.pdf', type: 'pdf' }] })"
      >
        drawer.sendMessage() 发消息给 iframe
      </button>
    </p>
    <div
      style="position: fixed; right: 10px; top: 10px; z-index: 99999; background: #ffe58f; padding: 8px 12px"
    >
      z-index: 99999 的元素
    </div>

    <h4 style="margin: 24px 0 8px">宿主收到的消息（receiveFiles / onVisibilityChange）：</h4>
    <div
      id="msg-log"
      style="font-family: Consolas, monospace; font-size: 12px; border-top: 1px solid #eee; padding-top: 8px; max-height: 240px; overflow: auto"
    ></div>

    <!-- 实际接入时把 src 换成 CDN 地址即可 -->
    <script src="./dist/ckc-expert-agent.umd.js"></script>
    <script>
      // 默认只创建悬浮圆形按钮；点击按钮后初始化抽屉（内容固定为 iframe）
      // iframe 最终地址：{域名}/center/thd/chat/{agentCode}[/{sessionId}]?token={token}
      // payload 选填，iframe 加载完成后通过 postMessage 传给 iframe
      // 显隐通过返回的 DrawerHandle 控制：drawer.open() / drawer.close()
      var drawer = window.createCkcDrawer({
        env: 'local', // 运行环境：dev / sit / pro / local，决定站点域名（本地联调改为 'local'）
        token: 'demo-token',
        agentCode: 'demo-agent',
        // sessionId: 'demo-session', // 选填；不传时 iframe 会生成 sessionId 并通过 receiveSessionId 回传
        payload: {
          message: '你好',
          files: [{ name: 'report.pdf', url: 'https://example.com/report.pdf', type: 'pdf' }],
        },
      });

      // 收发消息统一走 DrawerHandle 固定方法（sendMessage / receiveFiles / receiveSessionId / onVisibilityChange），
      // 宿主不需要（也不建议）直接使用 window.postMessage / message 事件
      function logMsg(text) {
        console.log('[host]', text);
        var line = document.createElement('div');
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
        var log = document.getElementById('msg-log');
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      }

      // 接受产物文件（iframe 发来的 drawer-files，payload 为 DrawerFile[]）
      drawer.receiveFiles(function (files) {
        logMsg('接受产物文件: ' + JSON.stringify(files));
      });

      // 接收 iframe 生成的 sessionId（未传 options.sessionId 时 iframe 生成并发出）
      drawer.receiveSessionId(function (sessionId) {
        logMsg('收到 sessionId: ' + sessionId);
      });

      // 抽屉显隐变化（含抽屉内关闭按钮触发的隐藏）
      drawer.onVisibilityChange(function (visible) {
        logMsg('抽屉' + (visible ? '显示' : '隐藏'));
      });
    </script>
  </body>
</html>
