<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ckc-expert-agent CDN 接入演示</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>宿主页面（模拟 CDN 接入方）</h1>
    <p>点击右下角悬浮圆形按钮打开抽屉（拖动按钮可移动位置）。</p>
    <p>抽屉左上角的黄色元素用于验证抽屉浮在页面最上方：</p>
    <p>
      <button onclick="drawer.open()">drawer.open() 打开</button>
      <button onclick="drawer.close()">drawer.close() 关闭</button>
      <button
        onclick="drawer.sendMessage({ message: '你好', files: [{ name: 'report.pdf', url: 'https://example.com/report.pdf', type: 'pdf' }], sessionId: 'demo-session', directSend: true })"
      >
        drawer.sendMessage() 发消息给 iframe
      </button>
    </p>
    <div
      style="position: fixed; right: 10px; top: 10px; z-index: 99999; background: #ffe58f; padding: 8px 12px"
    >
      z-index: 99999 的元素
    </div>

    <h4 style="margin: 24px 0 8px">宿主收到的消息（receiveMessage / onVisibilityChange）：</h4>
    <div
      id="msg-log"
      style="font-family: Consolas, monospace; font-size: 12px; border-top: 1px solid #eee; padding-top: 8px; max-height: 240px; overflow: auto"
    ></div>

    <!-- 实际接入时把 src 换成 CDN 地址即可 -->
    <script src="./dist/ckc-expert-agent.umd.js"></script>
    <script>
      // 默认只创建悬浮圆形按钮；点击按钮后初始化抽屉（内容固定为 iframe）
      // iframe 最终地址：{域名}/center/thd/chat/{agentCode}[/{sessionId}]?token={token}
      // 显隐通过返回的 DrawerHandle 控制：drawer.open() / drawer.close()
      var drawer = window.createCkcDrawer({
        env: 'local', // 运行环境：dev / sit / pro / local，决定站点域名（本地联调改为 'local'）
        token: 'demo-token',
        agentCode: 'demo-agent',
        // launcher: false, // 不生成悬浮图标入口（不显示悬浮按钮，抽屉只用方法控制）
        // mask: true, // 抽屉打开时给左侧页面区域加遮盖层
        maskClosable: true, // 点击遮盖层关闭抽屉（默认不关闭）
        closeSessionOnClose: true, // 关闭抽屉时关闭当前 agent 会话（默认不关闭）
        newSessionOnLauncherOpen: true, // 从悬浮按钮打开抽屉时重新开启新会话（默认不重新开启）
        resizable: false, // 关闭拖拽调整抽屉宽度（默认开启）
        // sessionId: 'demo-session', // 选填；不传时 iframe 会生成 sessionId 并通过 receiveSessionId 回传
      });

      // 收发消息统一走 DrawerHandle 固定方法（sendMessage / receiveMessage / receiveSessionId / onVisibilityChange），
      // 宿主不需要（也不建议）直接使用 window.postMessage / message 事件
      function logMsg(text) {
        console.log('[host]', text);
        var line = document.createElement('div');
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
        var log = document.getElementById('msg-log');
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      }

      // 接收消息（iframe 发来的 drawer-message，payload 为 {message, files, ...其它附带字段}）
      drawer.receiveMessage(function (message) {
        logMsg('收到消息: ' + JSON.stringify(message));
      });

      // 接收 iframe 生成的 sessionId（未传 options.sessionId 时 iframe 生成并发出）
      drawer.receiveSessionId(function (sessionId) {
        logMsg('收到 sessionId: ' + sessionId);
      });

      // 抽屉显隐变化（含抽屉内关闭按钮触发的隐藏）
      // 不返回值：抽屉直接显示/隐藏（默认）；返回布尔值或 Promise<boolean>（true=显示 / false=隐藏）可自行控制本次显隐
      // 第二参 sessionActive：当前 iframe 的 agent 是否处于正在会话状态（true=正在会话中）
      drawer.onVisibilityChange(function (visible, sessionActive) {
        if (visible) {
          logMsg('抽屉显示');
          return; // 请求显示：不返回值，按默认直接显示
        }
        if (!sessionActive) {
          logMsg('抽屉隐藏');
          return; // 不在会话状态：直接关闭，无需确认
        }
        // 会话状态：关闭前弹确认框（onVisibilityChange 返回 Promise<boolean> 自行控制显隐）
        return new Promise(function (resolve) {
          if (window.confirm('当前正在会话中，确定要关闭抽屉吗？')) {
            logMsg('确认关闭：抽屉隐藏');
            resolve(false); // 最终显隐 = 隐藏
          } else {
            logMsg('取消关闭：抽屉保持显示');
            resolve(true); // 最终显隐 = 显示（保持打开）
          }
        });
      });
    </script>
  </body>
</html>
